<!doctype html>
<!-- favicon.svg without its rounded corners: iOS and Android mask app icons themselves. `pnpm og` renders it at 512px and scales it down. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { inline-size: 512px; block-size: 512px; overflow: hidden; background: #d7f25a; }
  svg { display: block; inline-size: 512px; block-size: 512px; }
</style>
</head>
<body>
  <svg viewBox="0 0 32 32" aria-hidden="true"><path d="m12.5 10-6 6 6 6m7-12 6 6-6 6" fill="none" stroke="#1d2410" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
</body>
</html>
