# Every merge to main that touches the library publishes @digiup/native-base.
# The bump level comes from the merged PR (see .github/scripts/next-version.mjs);
# the release commit and tag are pushed back to main after npm accepts the package.
name: Release

on:
  push:
    branches: [main]
    paths: ['packages/ui/**']
  workflow_dispatch:
    inputs:
      level:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

# One release at a time, and never cancel one halfway through a publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the release commit, tag and GitHub release
  id-token: write # npm trusted publishing and provenance
  pull-requests: read

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - id: next
        run: node .github/scripts/next-version.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LEVEL: ${{ inputs.level }}

      # Not `npm version`: it reads the root `workspaces` field and chokes on the
      # pnpm-only `workspace:*` dependencies in the docs and examples.
      - if: steps.next.outputs.version
        working-directory: packages/ui
        run: npm pkg set version="${{ steps.next.outputs.version }}"

      # The version is baked into dist (llms files, the skill), so build after bumping.
      - if: steps.next.outputs.version
        run: pnpm build

      - if: steps.next.outputs.version
        working-directory: packages/ui
        run: npm publish --access public --provenance
        env:
          # Empty unless you add an NPM_TOKEN secret; trusted publishing needs no token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - if: steps.next.outputs.version
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git pull --rebase origin main
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"

      - if: steps.next.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes

      # Vercel already built the merged commit, before the bump, so the docs hero
      # still shows the old version. Rebuild main, which is now the release commit.
      # A deploy hook does it whether or not Vercel deploys the bot's push itself.
      - if: steps.next.outputs.version
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::warning::No VERCEL_DEPLOY_HOOK secret; the docs site may still show the old version."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK"
