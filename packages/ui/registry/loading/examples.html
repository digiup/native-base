<!-- @example: Skeleton -->
<div data-row style="--gap: 1rem">
  <span data-avatar data-skeleton></span>
  <div data-stack style="--gap: .5rem; flex: 1">
    <span data-skeleton style="inline-size: 60%"></span>
    <span data-skeleton style="inline-size: 40%"></span>
  </div>
</div>
<!-- @example: Busy -->
<div data-row>
  <button aria-busy="true" disabled>Please wait</button>
  <span data-spinner role="status" aria-label="Loading"></span>
</div>
