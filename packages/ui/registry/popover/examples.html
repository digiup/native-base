<!-- @example: Popover -->
<button popovertarget="dimensions" data-variant="outline">Dimensions</button>
<div popover id="dimensions">
  <form>
    <strong>Dimensions</strong>
    <label>Width <input value="100%"></label>
    <label>Height <input value="25px"></label>
  </form>
</div>
<!-- @example: Hint on interest -->
<button interestfor="save-hint" data-variant="outline">Hover or focus me</button>
<div popover="hint" id="save-hint">Saved to your library</div>
