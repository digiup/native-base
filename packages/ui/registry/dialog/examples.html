<!-- @example: Dialog -->
<button commandfor="edit-profile" command="show-modal" data-variant="outline">Edit profile</button>
<dialog id="edit-profile" closedby="any" aria-labelledby="edit-profile-title">
  <button commandfor="edit-profile" command="close" aria-label="Close">✕</button>
  <header>
    <h2 id="edit-profile-title">Edit profile</h2>
    <p>Make changes to your profile here.</p>
  </header>
  <form method="dialog">
    <label>Name <input value="Ada Lovelace"></label>
    <label>Username <input value="@ada"></label>
    <footer>
      <button value="cancel" data-variant="outline" formnovalidate>Cancel</button>
      <button value="save">Save changes</button>
    </footer>
  </form>
</dialog>
<!-- @example: Sheet -->
<button commandfor="settings-sheet" command="show-modal" data-variant="outline">Open sheet</button>
<dialog id="settings-sheet" data-side="right" closedby="any" aria-labelledby="settings-sheet-title">
  <button commandfor="settings-sheet" command="close" aria-label="Close">✕</button>
  <header>
    <h2 id="settings-sheet-title">Settings</h2>
    <p>Changes save automatically.</p>
  </header>
  <div data-stack>
    <label><input type="checkbox" role="switch" checked> Notifications</label>
    <label><input type="checkbox" role="switch"> Weekly digest</label>
  </div>
</dialog>
