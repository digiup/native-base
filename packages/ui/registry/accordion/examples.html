<div>
  <details name="faq" open>
    <summary>Is it accessible?</summary>
    <p>Yes. It's a native details element, so keyboard and screen reader support come free.</p>
  </details>
  <details name="faq">
    <summary>Is it animated?</summary>
    <p>Yes, with ::details-content and interpolate-size. No JavaScript.</p>
  </details>

    <p>Give every item the same name attribute.</p>
  </details>
</div>
