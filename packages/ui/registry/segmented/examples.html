<!-- @example: Segmented control -->
<fieldset data-segmented aria-label="Billing period">
  <label><input type="radio" name="billing" value="monthly" checked> Monthly</label>
  <label><input type="radio" name="billing" value="yearly"> Yearly</label>
  <label><input type="radio" name="billing" value="lifetime"> Lifetime</label>
</fieldset>
<!-- @example: With icons -->
<fieldset data-segmented>
  <legend>Theme</legend>
  <label>
    <input type="radio" name="appearance" value="light">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-17.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    Light
  </label>
  <label>
    <input type="radio" name="appearance" value="dark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    Dark
  </label>
  <label>
    <input type="radio" name="appearance" value="system" checked>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    System
  </label>
</fieldset>
<!-- @example: Sizes and icon-only -->
<div data-row style="--gap: calc(var(--spacing) * 4)">
  <fieldset data-segmented data-size="sm" aria-label="Date range">
    <label><input type="radio" name="range" value="24h"> 24h</label>
    <label><input type="radio" name="range" value="7d" checked> 7d</label>
    <label><input type="radio" name="range" value="30d"> 30d</label>
    <label><input type="radio" name="range" value="90d"> 90d</label>
  </fieldset>
  <fieldset data-segmented aria-label="View">
    <label>
      <input type="radio" name="view" value="list" aria-label="List" checked>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h.01M3 18h.01M3 6h.01M8 12h13M8 18h13M8 6h13"/></svg>
    </label>
    <label>
      <input type="radio" name="view" value="grid" aria-label="Grid">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
    </label>
  </fieldset>
  <fieldset data-segmented data-size="lg" aria-label="Plan">
    <label><input type="radio" name="plan" value="hobby"> Hobby</label>
    <label><input type="radio" name="plan" value="pro" checked> Pro</label>
    <label><input type="radio" name="plan" value="team"> Team</label>
  </fieldset>
</div>
