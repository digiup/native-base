<!-- @example: Dropzone -->
<label data-dropzone>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 13v8"/><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="m8 17 4-4 4 4"/></svg>
  <strong>Drop files here or click to browse</strong>
  <small>PDF, PNG or JPG, up to 10 MB each</small>
  <input type="file" name="attachments" multiple accept=".pdf,.png,.jpg,.jpeg">
</label>
<!-- @example: Required, in a form -->
<form data-card style="max-inline-size: 28rem">
  <header>
    <h3>Verify your business</h3>
    <p>Upload a recent bank statement or utility bill showing your company's address.</p>
  </header>
  <label data-dropzone>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
    <strong>Add a document</strong>
    <small data-hint>One PDF, issued in the last 3 months</small>
    <small data-error>A document is required to continue</small>
    <input type="file" name="proof" accept="application/pdf" required>
  </label>
  <footer data-row="end">
    <button type="submit">Submit for review</button>
  </footer>
</form>
<!-- @example: Compact -->
<label data-dropzone data-size="sm">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
  <strong>Upload a logo</strong>
  <small>SVG or PNG, at least 512 × 512 px</small>
  <input type="file" name="logo" accept="image/svg+xml,image/png">
</label>
